# What every proxied location repeats.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The remote-control endpoints are server-sent events. Buffering an endless
# response means the browser sees nothing until nginx gives up, so both of these
# are off, and the read timeout outlasts the keepalive comments the API sends.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 1h;
