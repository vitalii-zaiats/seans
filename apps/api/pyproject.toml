[project]
name = "api"
version = "0.1.0"
description = "Super Movies API — what the app talks to"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    # Imported directly by `modules/proxy`, `modules/stream` and
    # `modules/playback`; it arrived behind fastapi before, which is a
    # dependency nobody declared. `[socks]` because a `socks5://` proxy fails at
    # runtime without `socksio`, and the one place this matters is a machine
    # somebody is trying to give a Ukrainian exit to.
    "httpx[socks]>=0.28",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
api = "api.__main__:main"
# Writes `contracts/openapi.json`. A dev command rather than a build step: it
# imports the app, and the app is what it is describing.
openapi = "api.contract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
