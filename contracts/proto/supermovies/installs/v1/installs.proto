// The first call an app makes.
//
// Mirrors `apps/api/src/api/modules/installs/`. One RPC, because a cold start
// over a phone connection pays for every round trip and because the three
// answers are useless apart: there is no point telling a client its feature
// flags if the next thing it learns is that it must update before it may use
// them.

syntax = "proto3";

package supermovies.installs.v1;

import "google/protobuf/timestamp.proto";

// Where a copy of the app is running.
//
// Adding a member is wire-compatible, which is the property the database column
// was chosen for too — a varchar with a check constraint rather than a Postgres
// enum, so that `ios` costs no `ALTER TYPE`.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_ANDROID = 1;
  PLATFORM_LINUX = 2;
  PLATFORM_WINDOWS = 3;
  PLATFORM_WEB = 4;
}

// What the client should do about the version it reported.
enum UpdateAction {
  UPDATE_ACTION_UNSPECIFIED = 0;
  UPDATE_ACTION_NONE = 1;
  UPDATE_ACTION_OPTIONAL = 2;
  UPDATE_ACTION_REQUIRED = 3;
}

// Where a new version would come from.
enum UpdateChannel {
  UPDATE_CHANNEL_UNSPECIFIED = 0;
  // The shop that installed the app.
  UPDATE_CHANNEL_STORE = 1;
  // The build fetches it itself, from `url`.
  UPDATE_CHANNEL_SELF = 2;
  // Nothing to do.
  UPDATE_CHANNEL_AUTO = 3;
}

service InstallService {
  // Announce this install and collect everything it needs to start.
  //
  // Safe to call on every launch: the install row is updated rather than
  // duplicated, and a token sent in metadata is kept rather than replaced.
  rpc Init(InitRequest) returns (InitResponse);
}

message InitRequest {
  // Generated by the client, kept across restarts, new after a reinstall.
  //
  // **Omit it** and the launch is not written down at all: no install row, no
  // account, no session, and a response carrying only the update plan and the
  // feature flags. That is the "everything stays on this device" case, and it
  // is the client's choice to make, not ours — which is why this is `optional`
  // rather than a string that happens to be empty.
  //
  // `id` on the JSON wire.
  optional string install_id = 1;

  Platform platform = 2;

  // The installer package — `com.android.vending` for Play, an APK host, a
  // sideload. An open string, because Android will happily report a package
  // name nobody has heard of. Android only: sending it from anywhere else is
  // refused with INVALID_ARGUMENT rather than ignored, because silently
  // dropping it would let a client believe it had told us something.
  optional string vendor = 3;

  // `1.4.2` or `1.4.2+37`. A version this API cannot read is INVALID_ARGUMENT,
  // and nothing is written — the refusal comes before the row.
  //
  // `ver` on the JSON wire.
  string version = 4;
}

message InitResponse {
  // All three are absent for a client that sent no install id.
  optional Install install = 1;
  optional Account account = 2;
  optional Session session = 3;

  UpdatePlan update = 4;

  // Switches this build may see. Absent from the map means on, which is what
  // makes adding a section a change in the app rather than a deploy here.
  map<string, bool> features = 5;

  // For a device whose clock is wrong. Everything with a deadline in this
  // response is relative to this, not to the phone.
  google.protobuf.Timestamp server_time = 6;
}

message Install {
  string id = 1;
  // True only on the app's very first start.
  bool first_run = 2;
  google.protobuf.Timestamp registered_at = 3;
}

// As much of the account as starting up needs to say. `supermovies.accounts.v1`
// has the same shape and neither package imports the other — see the README.
message Account {
  string id = 1;
  string display_name = 2;
  // Absent until somebody puts an email on it — see `Claim`.
  optional string email = 3;
  bool is_guest = 4;
  bool is_admin = 5;
}

message Session {
  // Absent when the token you sent still works: keep using it. This is the
  // clearest case for explicit presence in the whole contract — an empty
  // string here would read as "here is your new token, it is nothing".
  optional string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message UpdatePlan {
  UpdateAction action = 1;
  UpdateChannel channel = 2;
  string current = 3;
  string latest = 4;
  string minimum = 5;
  // Set only when `channel` is SELF. A Play Store install is sent to its
  // listing instead, and never to this.
  optional string url = 6;
}
