[project]
name = "sweet-tv"
version = "0.1.0"
description = "Client for sweet.tv's free channels — the list, what is on, and a playable stream"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Vitalii" }]
# httpx is the default network stack, not a hard coupling: nothing under
# sweet_tv/ imports it except sweet_tv.transports.httpx, loaded lazily and only
# when a caller does not bring a transport of their own.
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sweet_tv"]
