# Headers every response from a static app carries.
#
# In its own file, and `include`d in each location rather than set once on the
# server, because nginx's `add_header` does not merge: a location that sets one
# header of its own discards every inherited one. That is easy to miss, and the
# way it is usually noticed is a security scan on the one path that happened to
# set a cache header — so these are repeated deliberately.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# Neither of these apps is a public page.
add_header X-Robots-Tag "noindex, nofollow" always;
