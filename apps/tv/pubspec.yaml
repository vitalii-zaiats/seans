name: seans_tv
description: The home screen of an Android TV box, and the movie app it is made of.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Everything that used to be a direct call to somebody else's service now
  # goes through our own API — which is what makes the web build possible at
  # all: kinostrain.com sends no CORS headers a browser will accept.
  super_movies_api: ^0.1.0

  # Pure-Dart packages that came across as they were: parsing and probing, with
  # no opinion about HTTP and nothing platform-specific in them.
  ashdi_finder: ^0.1.0
  cors_proxy: ^0.1.0
  doh: ^0.1.0
  hls: ^0.1.0
  iptv: ^0.1.0

  bloc: ^9.0.0
  cached_network_image: ^3.4.0
  equatable: ^2.0.7
  flutter_bloc: ^9.0.0
  go_router: ^14.6.0
  # For `SingleChildWidget`: flutter_bloc takes it as a dependency but does not
  # re-export the type, and `Parts.providers` has to name it.
  provider: ^6.1.0
  http: ^1.6.0
  qr_flutter: ^4.1.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.5.0
  video_player: ^2.9.2
  web: ^1.1.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # Generated by `tools/sfx-generator`, whose own `out/` is gitignored — so
    # the sounds the app ships are copies committed here, not references into a
    # directory that only exists on the machine that ran the generator.
    - assets/sfx/
