analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Fires on a constructor assigning a *private* field from a named parameter
    # — `_api = api`. Dart forbids a named parameter starting with an
    # underscore, so the initializing formal it asks for cannot be written.
    prefer_initializing_formals: false
