analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:lints/recommended.yaml

linter:
  rules:
    # Fires on constructors that assign a *private* field from a named
    # parameter — `_token = token`. Dart forbids a named parameter whose name
    # starts with an underscore, so the initializing formal it asks for cannot
    # be written. False positive every time here.
    prefer_initializing_formals: false
