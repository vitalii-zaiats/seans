[project]
name = "t9"
version = "0.1.0"
description = "Text to the digits you'd press on a phone keypad — Latin and Ukrainian"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Vitalii" }]
# Nothing. It is a lookup table and two loops.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t9"]
