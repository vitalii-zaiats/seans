[project]
name = "kinostrain"
version = "0.1.0"
description = "Typed Python client for the public kinostrain.com content API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Vitalii" }]
# httpx is the default network stack, not a hard coupling: nothing under
# kinostrain/ imports it except kinostrain.transports.httpx, which is loaded
# lazily and only when a caller does not bring a transport of their own.
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinostrain"]
